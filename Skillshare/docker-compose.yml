services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: 654654613245.dkr.ecr.ap-south-2.amazonaws.com/nithinsai/skill-desk:latest
    ports:
      - 8000:8000
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DJANGO_SETTINGS_MODULE=Skillshare.settings
    env_file:
      - .env
      
    depends_on:
      - db
    command: >
      sh -c "python3 manage.py makemigrations && python3 manage.py migrate && gunicorn Skillshare.wsgi:application --bind 0.0.0.0:8000"

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./docker-volumes:/var/lib/postgresql/data
    ports:
      - 5433:5432

volumes:
  static_volume:
  media_volume:
