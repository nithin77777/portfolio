{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<h2 class="text-center">Set New Password</h2>
<form method="post">
    {% csrf_token %}
    <div class="container-md mt-5">
        {{ form.as_p }}
        <button  type="submit" class="btn btn-primary">Update Password</button>
    </div>
</form>
{% endblock %}
