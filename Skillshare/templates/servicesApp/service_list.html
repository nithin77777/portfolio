{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'bootstrap-5.3.6/css/bootstrap.min.css' %}">
    <title>Services Page</title>
</head>

<body>




    <div class="container mt-5">
        <h1>Services We Provide</h1>
        {% for service in services %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">{{ service.service_name }}</h5>
                <p class="card-text">{{ service.service_description }}</p>
                <p class="card-text"><small class="text-muted">Price: ${{ service.service_price }}</small></p>
            </div>
        </div>
        {% endfor %}
    </div>


    <script src="{% static 'bootstrap-5.3.6/js/bootstrap.min.js' %}"></script>

</body>

</html>
