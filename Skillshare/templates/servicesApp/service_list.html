{% extends 'base.html' %}
{% load static %}

{% block title %}Services | SkillDesk{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Services We Provide</h1>
    {% for service in services %}
    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">{{ service.service_name }}</h5>
            <p class="card-text">{{ service.service_description }}</p>
            <p class="card-text"><small class="text-muted">Price: ${{ service.service_price }}</small></p>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
