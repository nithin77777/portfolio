{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<h2 class="text-center">Forgot Password</h2>
<form method="post">
    {% csrf_token %}
    <div class="container-md mt-5">
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Send Reset Link</button>
    </div>
</form>
{% endblock %}
